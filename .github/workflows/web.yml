name: Web (Next.js)

# Checks the headless front end in apps/web. Deployment is separate (see
# apps/web/README.md); this workflow never touches production.

on:
  pull_request:
    paths:
      - apps/web/**
      - apps/wordpress/wp-content/themes/apex-idaho/theme.json
      - apps/wordpress/wp-content/themes/apex-idaho/styles/**
      - apps/wordpress/wp-content/themes/apex-idaho/assets/css/theme.css
      - apps/wordpress/wp-content/themes/apex-idaho/blocks/blocks.css
      - .github/workflows/web.yml
  push:
    branches:
      - main
    paths:
      - apps/web/**
      - apps/wordpress/wp-content/themes/apex-idaho/theme.json
      - apps/wordpress/wp-content/themes/apex-idaho/styles/**
      - apps/wordpress/wp-content/themes/apex-idaho/assets/css/theme.css
      - apps/wordpress/wp-content/themes/apex-idaho/blocks/blocks.css
      - .github/workflows/web.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The design tokens and theme CSS are generated from the block theme.
      # Fail if someone changed the theme without re-running the sync.
      - name: Design tokens in sync with the block theme
        run: |
          npm run sync:tokens
          git diff --exit-code -- src/styles || {
            echo "::error::apps/web/src/styles is out of date. Run 'npm run sync:tokens' in apps/web and commit the result."
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Builds against the live WordPress REST API. Fetches fail soft, so the
      # build still passes if the site is unreachable.
      - name: Build
        run: npm run build
        env:
          WORDPRESS_URL: https://apex-idaho.com
          NEXT_PUBLIC_SITE_URL: https://apex-idaho.com
          NEXT_TELEMETRY_DISABLED: 1
