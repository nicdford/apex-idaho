name: Deploy to Cloudways

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Sync themes and plugins to Cloudways
    runs-on: ubuntu-latest

    env:
      LFTP_PASSWORD: ${{ secrets.CLOUDWAYS_SSH_PASSWORD }}
      LFTP_HOST: ${{ secrets.CLOUDWAYS_HOST }}
      LFTP_PORT: ${{ secrets.CLOUDWAYS_SSH_PORT }}
      LFTP_USER: ${{ secrets.CLOUDWAYS_USER }}
      LFTP_PATH: ${{ secrets.CLOUDWAYS_PATH }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist
        working-directory: apps/wordpress/wp-content/themes/bb-theme-child

      - name: Deploy themes (mirror with delete)
        run: |
          lftp -u "$LFTP_USER,$LFTP_PASSWORD" -p "$LFTP_PORT" \
            -e "set sftp:auto-confirm yes; \
                mirror -R --delete --verbose --parallel=4 \
                  apps/wordpress/wp-content/themes/ $LFTP_PATH/wp-content/themes/; \
                bye" \
            sftp://$LFTP_HOST

      - name: Deploy plugins (mirror without delete)
        run: |
          lftp -u "$LFTP_USER,$LFTP_PASSWORD" -p "$LFTP_PORT" \
            -e "set sftp:auto-confirm yes; \
                mirror -R --verbose --parallel=4 \
                  apps/wordpress/wp-content/plugins/ $LFTP_PATH/wp-content/plugins/; \
                bye" \
            sftp://$LFTP_HOST

      - name: Deploy Pitwall plugin (mirror without delete)
        run: |
          lftp -u "$LFTP_USER,$LFTP_PASSWORD" -p "$LFTP_PORT" \
            -e "set sftp:auto-confirm yes; \
                mirror -R --verbose --parallel=4 \
                  apps/pitwall-wp/ $LFTP_PATH/wp-content/plugins/pitwall/; \
                bye" \
            sftp://$LFTP_HOST

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *apex-idaho deploy ${{ job.status }}*\n${{ github.actor }} merged into `main` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
