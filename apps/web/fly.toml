# APEX Idaho public site on Fly.io.
#
# First time:
#   fly launch --no-deploy --copy-config   (from apps/web; keep or change the app name)
#   fly secrets set REVALIDATE_SECRET=<same value as APEX_HEADLESS_REVALIDATE_SECRET in wp-config.php>
#   fly scale count 1
# Then `fly deploy`. See README.md for the domain switch.
#
# Run ONE machine. Cached pages live on the machine's disk, and WordPress's
# revalidation webhook reaches only the machine that answers it; a second
# machine would keep serving stale content until its own timer refreshes it.

app = "apex-idaho-web"
primary_region = "sea"

[build]
  [build.args]
    WORDPRESS_URL = "https://apex-idaho.com"
    NEXT_PUBLIC_SITE_URL = "https://apex-idaho.com"
    # After the domain switch, WordPress lives on its own host:
    # WORDPRESS_URL = "https://cms.apex-idaho.com"

[env]
  PORT = "8080"
  REVALIDATE_SECONDS = "300"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/robots.txt"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
