name: Deploy to Cloudways

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Sync themes and plugins to Cloudways
    runs-on: ubuntu-latest

    env:
      SSHPASS: ${{ secrets.CLOUDWAYS_SSH_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass and seed known_hosts
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.CLOUDWAYS_SSH_PORT }} ${{ secrets.CLOUDWAYS_HOST }} >> ~/.ssh/known_hosts

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist
        working-directory: apps/wordpress/wp-content/themes/bb-theme-child

      - name: Deploy themes via rsync
        run: |
          sshpass -e rsync -avz --delete \
            -e "ssh -p ${{ secrets.CLOUDWAYS_SSH_PORT }} -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -o PreferredAuthentications=password" \
            apps/wordpress/wp-content/themes/ \
            ${{ secrets.CLOUDWAYS_USER }}@${{ secrets.CLOUDWAYS_HOST }}:${{ secrets.CLOUDWAYS_PATH }}/wp-content/themes/

      - name: Deploy plugins via rsync
        run: |
          sshpass -e rsync -avz \
            -e "ssh -p ${{ secrets.CLOUDWAYS_SSH_PORT }} -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -o PreferredAuthentications=password" \
            apps/wordpress/wp-content/plugins/ \
            ${{ secrets.CLOUDWAYS_USER }}@${{ secrets.CLOUDWAYS_HOST }}:${{ secrets.CLOUDWAYS_PATH }}/wp-content/plugins/

      - name: Deploy Pitwall plugin via rsync
        run: |
          sshpass -e rsync -avz \
            -e "ssh -p ${{ secrets.CLOUDWAYS_SSH_PORT }} -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -o PreferredAuthentications=password" \
            apps/pitwall-wp/ \
            ${{ secrets.CLOUDWAYS_USER }}@${{ secrets.CLOUDWAYS_HOST }}:${{ secrets.CLOUDWAYS_PATH }}/wp-content/plugins/pitwall/

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *apex-idaho deploy ${{ job.status }}*\n${{ github.actor }} merged into `main` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
